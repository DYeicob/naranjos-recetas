#!/usr/bin/nft -f
# ==========================================================================
#  Cortafuegos de NaranjOS (nftables)
#   · Entrante: TODO cerrado, salvo las respuestas a lo que tú inicias.
#   · Saliente: abierto.
#   · Para abrir un puerto NO edites este fichero: usa
#         naranjos-peel abre 22/tcp
#     (se guarda en /etc/nftables.d/naranjos-puertos.nft)
# ==========================================================================
flush ruleset

table inet naranjos {
	chain abiertos {
		# aquí entran los puertos que abras con «naranjos-peel abre»
	}

	chain entrada {
		type filter hook input priority filter; policy drop;

		ct state vmap { established : accept, related : accept, invalid : drop }
		iif "lo" accept

		# ICMP: lo necesita la red para funcionar bien (sobre todo IPv6)
		meta l4proto ipv6-icmp accept
		ip protocol icmp icmp type echo-request limit rate 5/second accept
		ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept

		# respuestas DHCP (IPv4 e IPv6)
		udp sport 67 udp dport 68 accept
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

		jump abiertos

		# lo bloqueado se anota (con límite, para no llenar el registro): journalctl -k -g naranjos-cortafuegos
		limit rate 3/minute burst 5 packets log prefix "naranjos-cortafuegos: " level info
	}

	chain reenvio {
		type filter hook forward priority filter; policy drop;
	}

	chain salida {
		type filter hook output priority filter; policy accept;
	}
}

include "/etc/nftables.d/*.nft"
