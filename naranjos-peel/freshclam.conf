# NaranjOS peel · firmas del antivirus (ClamAV). Las pone al día naranjos-firmas.timer cada 6 horas.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
LogTime yes
# freshclam no tiene que avisar a ningún clamd: NaranjOS analiza con clamscan
NotifyClamd no
