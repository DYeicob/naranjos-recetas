# NaranjOS · fotos del sistema (orden «fotos», paquete naranjos-fotos)
# Cuántas fotos AUTOMÁTICAS se guardan (las de «zumo actualiza» y las de las tandas).
# Las que haces tú con «sudo fotos crea» no se borran solas.
GUARDAR=5
# Subvolúmenes (en la raíz del Btrfs). No los cambies si no sabes lo que haces.
RAIZ_SUB=@
FOTOS_SUB=@fotos
