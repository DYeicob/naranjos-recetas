# NaranjOS · pantalla de bloqueo (~/.config/hypr/hyprlock.conf)
# Colores y fondo: los del tema (naranjos-tema)
source = ~/.config/naranjos/tema/hyprlock.conf
$fuente = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $bloqueo
    blur_passes = 2
}

# Logo de NaranjOS
image {
    monitor =
    path = /usr/share/naranjos/logo/naranjos-logo-256.png
    size = 150
    rounding = 0
    border_size = 0
    position = 0, 400
    halign = center
    valign = center
}

# Hora
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $fuente
    color = $acento
    position = 0, 220
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 22
    font_family = $fuente
    color = $texto
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 22%, 5%
    outline_thickness = 2
    inner_color = $campo
    outer_color = $acento_borde $acento2 45deg
    check_color = $acento2
    fail_color = $mal
    font_color = $texto
    fade_on_empty = false
    rounding = 12
    font_family = $fuente
    placeholder_text = 
    fail_text = $FAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = NaranjOS
    font_size = 14
    font_family = $fuente
    color = $apagado
    position = 0, 30
    halign = center
    valign = bottom
}
