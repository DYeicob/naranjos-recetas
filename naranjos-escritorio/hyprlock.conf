# NaranjOS · pantalla de bloqueo (~/.config/hypr/hyprlock.conf)
$fuente = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /usr/share/backgrounds/naranjos/naranjos-bloqueo.jpg
    blur_passes = 2
}

# Hora
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $fuente
    color = rgba(ff8700ff)
    position = 0, 220
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d de %B"
    font_size = 22
    font_family = $fuente
    color = rgba(e6e6e6ff)
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 22%, 5%
    outline_thickness = 2
    inner_color = rgba(18, 18, 18, 0.85)
    outer_color = rgba(ff8700ee) rgba(ffaf5fee) 45deg
    check_color = rgba(ffaf5fee)
    fail_color = rgba(ff5f5fee)
    font_color = rgb(230, 230, 230)
    fade_on_empty = false
    rounding = 12
    font_family = $fuente
    placeholder_text = Contraseña…
    fail_text = Contraseña incorrecta
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = NaranjOS
    font_size = 14
    font_family = $fuente
    color = rgba(8a8a8aff)
    position = 0, 30
    halign = center
    valign = bottom
}
