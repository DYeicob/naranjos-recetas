# NaranjOS · fondo de pantalla (~/.config/hypr/hyprpaper.conf)
# Cambia "path" por cualquier imagen o carpeta. Fondos de NaranjOS: /usr/share/backgrounds/naranjos/
splash = false
ipc = true

wallpaper {
    monitor = *
    path = /usr/share/backgrounds/naranjos/naranjos-01.jpg
    fit_mode = cover
}
