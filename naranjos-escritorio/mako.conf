# NaranjOS · notificaciones (~/.config/mako/config)
font=JetBrainsMono Nerd Font 11
# colores: los del tema (naranjos-tema)
include=~/.config/naranjos/tema/mako.conf
border-size=2
border-radius=10
padding=12
margin=12
width=380
anchor=top-right
default-timeout=5000

# volumen y brillo (naranjos-osd): abajo, en el centro, y sin guardarse en el historial
[app-name=naranjos-osd]
anchor=bottom-center
width=260
text-alignment=center
default-timeout=1500
history=0

[urgency=high]
border-color=#ff5f5f
default-timeout=0
