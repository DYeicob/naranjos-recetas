# NaranjOS · tmux (~/.config/tmux/tmux.conf) — chuleta: Super + Alt + K
set -g prefix C-a                      # Ctrl + a en vez de Ctrl + b
unbind C-b; bind C-a send-prefix
set -g mouse on
set -g base-index 1; setw -g pane-base-index 1; set -g renumber-windows on
set -g history-limit 50000; set -sg escape-time 10; set -g focus-events on
set -g default-terminal "tmux-256color"; set -ga terminal-overrides ",foot:RGB"
set -g set-titles on; set -g set-titles-string "#H · #S"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -n M-Left select-pane -L; bind -n M-Right select-pane -R; bind -n M-Up select-pane -U; bind -n M-Down select-pane -D
bind -n M-S-Left previous-window; bind -n M-S-Right next-window
bind z resize-pane -Z
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux: configuración recargada"
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection; bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
# colores de NaranjOS
set -g status-position top
set -g status-style "bg=#121212,fg=#e8e8e8"
set -g status-left "#[bg=#ff8700,fg=#121212,bold]  #S #[default] "
set -g status-right "#[fg=#ff8700]#H #[fg=#888888]%H:%M "
setw -g window-status-current-format "#[fg=#ff8700,bold] #I:#W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-format "#[fg=#888888] #I:#W "
set -g pane-border-style "fg=#2a2a2a"; set -g pane-active-border-style "fg=#ff8700"
set -g message-style "bg=#ff8700,fg=#121212"
