# NaranjOS · terminal (~/.config/foot/foot.ini)
[main]
# colores: los del tema (naranjos-tema)
include=~/.config/naranjos/tema/foot.ini
font=JetBrainsMono Nerd Font:size=11
# tamaño del texto (naranjos-pantalla texto 1.25)
include=~/.config/naranjos/pantalla/foot.ini
pad=12x10

[cursor]
style=beam
blink=yes

