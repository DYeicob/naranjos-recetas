# NaranjOS · inactividad (~/.config/hypr/hypridle.conf)
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 2,5 min: baja el brillo
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 4 min: salvapantallas de NaranjOS (se quita al tocar el teclado o el ratón)
listener {
    timeout = 240
    on-timeout = naranjos-salvapantallas
    on-resume = pkill -f 'app-id=naranjos-salvapantallas'
}

# 5 min: bloquea
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5,5 min: apaga la pantalla
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
