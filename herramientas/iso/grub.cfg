# NaranjOS @VERSION@ · menú de la ISO en vivo
set timeout=8
set default=0
if loadfont (memdisk)/fonts/dejavu-16.pf2; then
  set gfxmode=auto
  terminal_output gfxterm
fi
set color_normal=light-gray/black
set color_highlight=black/brown
set menu_color_normal=light-gray/black
set menu_color_highlight=black/brown

menuentry "Probar NaranjOS @VERSION@" --class naranjos {
  echo "Arrancando NaranjOS…"
  linux /boot/vmlinuz-linux-naranjos naranjos.vivo=@ETIQUETA@ rw quiet splash loglevel=3
  initrd /boot/initramfs-linux-naranjos.img
}
menuentry "Probar NaranjOS (gráficos sencillos, si la pantalla se queda en negro)" --class naranjos {
  linux /boot/vmlinuz-linux-naranjos naranjos.vivo=@ETIQUETA@ rw nomodeset
  initrd /boot/initramfs-linux-naranjos.img
}
menuentry "Probar NaranjOS (con todos los mensajes)" --class naranjos {
  linux /boot/vmlinuz-linux-naranjos naranjos.vivo=@ETIQUETA@ rw
  initrd /boot/initramfs-linux-naranjos.img
}
menuentry "Ajustes del firmware (UEFI)" { fwsetup }
menuentry "Reiniciar" { reboot }
menuentry "Apagar" { halt }
