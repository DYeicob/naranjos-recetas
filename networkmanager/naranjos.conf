# NaranjOS · NetworkManager (paquete networkmanager; tus cambios, en /etc/NetworkManager/conf.d)
[main]
dns=systemd-resolved
rc-manager=symlink

[device]
# la WiFi la lleva iwd por debajo (más rápido y ya configurado en NaranjOS)
wifi.backend=iwd

[keyfile]
# la VPN de NaranjOS (naranjos-peel vpn) la sigue llevando systemd-networkd
unmanaged-devices=interface-name:naranjos-vpn

[connectivity]
# para detectar «portales cautivos» (hoteles, trenes…): pide una página pequeña de GNOME cada 5 minutos
uri=http://nmcheck.gnome.org/check_network_status.txt
interval=300
