#
# /etc/pacman.conf — NaranjOS
# zumo usa pacman por dentro. Normalmente no hace falta tocar este fichero.
#
[options]
HoldPkg           = pacman glibc naranjos-base
Architecture      = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
DownloadUser      = alpm

# Seguridad: todo paquete debe venir firmado por una clave de confianza
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

# Repositorio de NaranjOS (local; se publicará en GitHub)
[naranjos-core]
SigLevel = Required DatabaseRequired
Server   = file:///srv/zumo/naranjos-core
Server   = https://github.com/DYeicob/naranjos-recetas/releases/download/naranjos-core
