# NaranjOS · ajustes del initramfs (naranjos-initramfs)
# Tras cambiar algo:  sudo naranjos-initramfs --todos

# Módulos extra que meter, separados por espacios (p. ej. MODULOS="i915 amdgpu")
MODULOS=""

# Microcódigo del procesador:
#   todos → el de todos los Intel y AMD (el disco arranca igual de bien en cualquier PC)
#   este  → solo el del procesador de este equipo (initramfs más pequeño)
MICROCODIGO=todos
